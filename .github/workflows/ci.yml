name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # includes `scripts/generate.py --check`: the spec files are up to date
      - run: uv run pytest

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            js/package-lock.json
            site/package-lock.json
      - run: npm ci
      # tsc checks viewer/ too, with CodeMirror's types from site/node_modules
      - run: npm ci --prefix ../site
      - run: npm run check
      - run: npm test

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      # the committed CodeMirror bundle is what the lockfile builds
      - run: npm run --prefix site vendor -- --check
      # fails on any broken relative link or #anchor in the docs
      - run: npm run --prefix site build
      - run: npx playwright install --with-deps chromium
        working-directory: site
      # the built site in a real browser: pages, viewer, a playground edit
      - run: npm run --prefix site smoke
