[project]
name = "wiring-diagrams"
version = "0.1.0"
description = "The operad of wiring diagrams (Spivak, arXiv:1305.0297): typed cospans, pushout composition, closed structure, and the Rel and Eq algebras"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Louis Maddox", email = "louismmx@gmail.com" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiring_diagrams"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Docstrings and messages use mathematical notation (∘, ⊔, σ, ×) on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]
